<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Aegis setup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23ff9830'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-weight='700' font-size='19' fill='%2316181c' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/console.css">
</head>
<body class="gate">

<main class="gate-card">
  <div class="gate-brand"><span class="mark">A</span><strong>Aegis</strong></div>
  <h1>Set up the console</h1>
  <p class="gate-note">Pick the password for this console. It protects configuration and monitoring only.
  The machine endpoints on this port stay open for your apps and gateways.</p>

  <div class="field">
    <label for="password">password</label>
    <input id="password" type="password" autocomplete="new-password" autofocus>
  </div>
  <div class="field">
    <label for="confirm">repeat password</label>
    <input id="confirm" type="password" autocomplete="new-password">
  </div>
  <button id="go" class="btn primary">create console</button>
  <div id="err" class="gate-err" role="alert"></div>
  <div class="gate-foot">minimum 8 characters</div>
</main>

<script>
const $ = (s) => document.querySelector(s);

async function setup() {
  const password = $("#password").value;
  if (password.length < 8) { $("#err").textContent = "password needs at least 8 characters"; return; }
  if (password !== $("#confirm").value) { $("#err").textContent = "passwords do not match"; return; }

  $("#go").disabled = true;
  try {
    const res = await fetch("/console/api/setup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(typeof data.detail === "string" ? data.detail : "setup failed");
    }
    location.href = "/console";
  } catch (err) {
    $("#err").textContent = err.message;
    $("#go").disabled = false;
  }
}

$("#go").onclick = setup;
$("#confirm").addEventListener("keydown", (e) => { if (e.key === "Enter") setup(); });
</script>
</body>
</html>
